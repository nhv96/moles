[project]
name = "moles-content"
version = "0.1.0"
description = "Content pipeline: validate lesson files and build lesson audio"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "soundfile",
    "jsonschema>=4.26.0",
]

[dependency-groups]
# Kokoro is large (it brings PyTorch). It is a separate group so that CI can run the tests
# without it: `uv sync --no-default-groups --group dev`.
audio = [
    "kokoro>=0.9",
]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
default-groups = ["audio", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
