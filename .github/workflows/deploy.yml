# Checks the app on every pull request, and deploys it to GitHub Pages when
# main changes in a way that affects the app. Docs-only merges do not run.
# The lesson audio comes from content/build (committed).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'content/build/**'
      - '.github/workflows/deploy.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # base_path is /<repo> on a project site; the app needs a trailing slash.
        run: BASE_PATH="${{ steps.pages.outputs.base_path }}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
